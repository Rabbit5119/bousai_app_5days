{% extends "base.html" %}

{% block content %}
<!-- 避難所マップ -->
<section class="home-card map-card">
    <h2>
        <img class="home-heading-icon" src="{{ url_for('static', filename='icons/map-pin.svg') }}" alt="">
        避難所マップ
    </h2>
    <div id="shelterMap"></div>
</section>

<!-- 気象警報・注意報 -->
<section class="home-card weather-card">
    <div class="weather-heading">
        <h2>
            <img class="home-heading-icon" src="{{ url_for('static', filename='icons/weather.svg') }}" alt="">
            青森市 気象警報・注意報
        </h2>
        <span class="weather-refresh">
            <img class="weather-refresh-icon" src="{{ url_for('static', filename='icons/refresh.svg') }}" alt="">
            10分おき自動更新
        </span>
    </div>
    <div id="weatherContent" class="weather-panel">
        <p>読み込み中...</p>
    </div>
</section>

<!-- Leaflet の読み込み -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // 地図の初期化（藤沢市周辺を中心に設定）
    const map = L.map('shelterMap').setView([35.3390, 139.4903], 12);

    // OpenStreetMapタイルを追加
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // 気象警報・注意報の自動更新機能
    function updateWeatherWarnings() {
        fetch('/api/weather_warnings')
            .then(response => response.json())
            .then(data => {
                console.log('気象情報を更新しました:', data);
                updateWeatherContent(data);
            })
            .catch(error => {
                console.error('気象情報の更新に失敗しました:', error);
            });
    }

    function updateWeatherContent(data) {
        const weatherContent = document.getElementById('weatherContent');

        if (data.error) {
            weatherContent.innerHTML = '<p>気象情報の取得に失敗しました</p>';
            return;
        }

        let warningsHtml = '';
        if (data.warnings && data.warnings.length > 0) {
            warningsHtml = '<ul>';
            data.warnings.forEach(warning => {
                warningsHtml += `<li>${warning.name}（${warning.status}）</li>`;
            });
            warningsHtml += '</ul>';
        } else {
            warningsHtml = '<p class="weather-status"><img class="weather-status-icon" src="{{ url_for('static', filename='icons/check-circle.svg') }}" alt="">現在、警報・注意報は発表されていません</p>';
        }

        weatherContent.innerHTML = `
            <p class="weather-detail"><img class="weather-detail-icon" src="{{ url_for('static', filename='icons/map-pin.svg') }}" alt="">${data.area_name || '青森市'}</p>
            ${warningsHtml}
            <p class="weather-detail"><img class="weather-detail-icon" src="{{ url_for('static', filename='icons/clock.svg') }}" alt="">データ取得: <span id="lastFetchTime">${data.last_fetch_time || '更新中...'}</span></p>
            <p class="weather-detail"><img class="weather-detail-icon" src="{{ url_for('static', filename='icons/announcement.svg') }}" alt="">気象庁最終発表: ${data.report_time || '不明'}</p>
        `;
    }

    // 初回表示＋10分（600,000ミリ秒）おきに自動更新
    updateWeatherWarnings();
    setInterval(updateWeatherWarnings, 600000);
});
</script>
{% endblock %}
